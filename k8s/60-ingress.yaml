# HTTPS through k3s's built-in Traefik, with a free Let's Encrypt certificate that renews itself.
# (This first object tells Traefik your email, where to keep the certificate, and to redirect HTTP to HTTPS.)
apiVersion: helm.cattle.io/v1
kind: HelmChartConfig
metadata: { name: traefik, namespace: kube-system }
spec:
  valuesContent: |-
    additionalArguments:
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/data/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.tlschallenge=true"
    persistence:
      enabled: true
      path: /data
    ports:
      web:
        redirections:
          entryPoint:
            to: websecure
            scheme: https
            permanent: true
    service:
      spec:
        externalTrafficPolicy: Local
---
# /api goes straight to the API pod (so it sees real visitor IPs for rate limiting); everything else to the web pod.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: academy
  namespace: academy
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: websecure
    traefik.ingress.kubernetes.io/router.tls.certresolver: letsencrypt
spec:
  tls:
    - hosts: ["${DOMAIN}"]
  rules:
    - host: "${DOMAIN}"
      http:
        paths:
          - { path: /api, pathType: Prefix, backend: { service: { name: server, port: { number: 4000 } } } }
          - { path: /, pathType: Prefix, backend: { service: { name: web, port: { number: 8080 } } } }
