# Practice lab: one pod per engine. Throw-away data, reachable only from the API pod (see 50-network-policy.yaml).
# ---- PostgreSQL lab ----
apiVersion: v1
kind: Service
metadata: { name: pg-lab, namespace: academy }
spec:
  selector: { app: pg-lab }
  ports: [{ port: 5432, targetPort: 5432 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: pg-lab, namespace: academy }
spec:
  serviceName: pg-lab
  replicas: 1
  selector: { matchLabels: { app: pg-lab } }
  template:
    metadata: { labels: { app: pg-lab, tier: lab } }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: postgres
          image: postgres:16-alpine
          args: ["postgres", "-c", "max_connections=100", "-c", "shared_buffers=128MB", "-c", "log_min_messages=warning"]
          ports: [{ containerPort: 5432 }]
          env:
            - { name: PGDATA, value: /var/lib/postgresql/data/pgdata }
            - name: POSTGRES_PASSWORD
              valueFrom: { secretKeyRef: { name: academy-secrets, key: LAB_ADMIN_PASSWORD } }
          readinessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            periodSeconds: 5
            failureThreshold: 12
          livenessProbe:
            exec: { command: ["pg_isready", "-h", "127.0.0.1", "-U", "postgres"] }
            initialDelaySeconds: 30
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 192Mi }
            limits: { memory: 512Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/postgresql/data }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 3Gi } }
---
# ---- MySQL lab ----
apiVersion: v1
kind: Service
metadata: { name: mysql-lab, namespace: academy }
spec:
  selector: { app: mysql-lab }
  ports: [{ port: 3306, targetPort: 3306 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mysql-lab, namespace: academy }
spec:
  serviceName: mysql-lab
  replicas: 1
  selector: { matchLabels: { app: mysql-lab } }
  template:
    metadata: { labels: { app: mysql-lab, tier: lab } }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mysql
          image: mysql:8.4
          args: ["--local-infile=0", "--max-connections=200", "--innodb-buffer-pool-size=128M", "--skip-name-resolve"]
          ports: [{ containerPort: 3306 }]
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: academy-secrets, key: LAB_ADMIN_PASSWORD } }
          # During first-boot initialisation MySQL has networking off, so a TCP check only passes when it is really ready.
          readinessProbe:
            tcpSocket: { port: 3306 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket: { port: 3306 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 384Mi }
            limits: { memory: 768Mi }
          volumeMounts: [{ name: data, mountPath: /var/lib/mysql }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 3Gi } }
---
# ---- MongoDB lab ----
apiVersion: v1
kind: Service
metadata: { name: mongo-lab, namespace: academy }
spec:
  selector: { app: mongo-lab }
  ports: [{ port: 27017, targetPort: 27017 }]
---
apiVersion: apps/v1
kind: StatefulSet
metadata: { name: mongo-lab, namespace: academy }
spec:
  serviceName: mongo-lab
  replicas: 1
  selector: { matchLabels: { app: mongo-lab } }
  template:
    metadata: { labels: { app: mongo-lab, tier: lab } }
    spec:
      enableServiceLinks: false
      terminationGracePeriodSeconds: 60
      containers:
        - name: mongo
          image: mongo:7.0
          # --noscripting: no server-side JavaScript ($where, $function) for learners
          args: ["mongod", "--auth", "--noscripting", "--bind_ip_all", "--wiredTigerCacheSizeGB", "0.25"]
          ports: [{ containerPort: 27017 }]
          env:
            - { name: MONGO_INITDB_ROOT_USERNAME, value: root }
            - name: MONGO_INITDB_ROOT_PASSWORD
              valueFrom: { secretKeyRef: { name: academy-secrets, key: LAB_ADMIN_PASSWORD } }
          # The temporary first-boot server only listens on localhost, so a check on the pod IP passes only when it is really ready.
          readinessProbe:
            tcpSocket: { port: 27017 }
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            tcpSocket: { port: 27017 }
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 6
          resources:
            requests: { cpu: 100m, memory: 320Mi }
            limits: { memory: 640Mi }
          volumeMounts: [{ name: data, mountPath: /data/db }]
  volumeClaimTemplates:
    - metadata: { name: data }
      spec:
        accessModes: [ReadWriteOnce]
        resources: { requests: { storage: 3Gi } }
